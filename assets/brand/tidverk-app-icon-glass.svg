<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Tidverk Liquid Glass app icon</title>
  <desc id="desc">A layered glass Tidverk T and clock-hand mark on a deep graphite background.</desc>
  <defs>
    <linearGradient id="background" x1="120" y1="72" x2="900" y2="952" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#242833" />
      <stop offset="0.48" stop-color="#10131A" />
      <stop offset="1" stop-color="#050608" />
    </linearGradient>
    <radialGradient id="cool-light" cx="0" cy="0" r="1" gradientTransform="translate(254 178) rotate(42) scale(650)">
      <stop offset="0" stop-color="#C8DDFF" stop-opacity="0.34" />
      <stop offset="0.48" stop-color="#7599D6" stop-opacity="0.11" />
      <stop offset="1" stop-color="#38517D" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="warm-light" cx="0" cy="0" r="1" gradientTransform="translate(850 900) rotate(-135) scale(560)">
      <stop offset="0" stop-color="#D9C7FF" stop-opacity="0.16" />
      <stop offset="1" stop-color="#D9C7FF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="glass-fill" x1="250" y1="160" x2="740" y2="856" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98" />
      <stop offset="0.34" stop-color="#EDF4FF" stop-opacity="0.88" />
      <stop offset="0.72" stop-color="#B8CAE5" stop-opacity="0.72" />
      <stop offset="1" stop-color="#F8FBFF" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="specular" x1="340" y1="158" x2="612" y2="660" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.16" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <clipPath id="icon-shape">
      <rect x="64" y="64" width="896" height="896" rx="200" />
    </clipPath>
    <g id="tidverk-mark">
      <path d="M104 40H600C640 40 672 72 672 112S640 184 600 184H424V592C424 632 392 664 352 664S280 632 280 592V184H104C64 184 32 152 32 112S64 40 104 40Z" />
      <path d="M316 366L524 234C558 212 603 222 625 256C647 290 637 335 603 357L395 489C361 511 316 501 294 467C272 433 282 388 316 366Z" />
    </g>
    <clipPath id="mark-clip">
      <use href="#tidverk-mark" transform="translate(160 160)" />
    </clipPath>
  </defs>
  <g clip-path="url(#icon-shape)">
    <rect x="64" y="64" width="896" height="896" fill="url(#background)" />
    <rect x="64" y="64" width="896" height="896" fill="url(#cool-light)" />
    <rect x="64" y="64" width="896" height="896" fill="url(#warm-light)" />
    <use href="#tidverk-mark" transform="translate(160 160)" fill="url(#glass-fill)" />
    <g clip-path="url(#mark-clip)">
      <ellipse cx="342" cy="214" rx="520" ry="190" fill="url(#specular)" transform="rotate(-12 342 214)" />
      <ellipse cx="760" cy="790" rx="400" ry="120" fill="#FFFFFF" opacity="0.1" transform="rotate(-18 760 790)" />
    </g>
    <use href="#tidverk-mark" transform="translate(160 160)" fill="none" stroke="#FFFFFF" stroke-opacity="0.38" stroke-width="12" />
    <rect x="70" y="70" width="884" height="884" rx="194" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="12" />
  </g>
</svg>
