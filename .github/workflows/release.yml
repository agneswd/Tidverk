name: Publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - shell: bash
        run: |
          version=$(dotnet msbuild src/Tidverk.App/Tidverk.App.csproj -getProperty:Version -nologo)
          test "${GITHUB_REF_NAME}" = "v${version}"
          test -f "docs/release-notes/${version}.md"
      - run: dotnet restore Tidverk.sln --disable-parallel
      - run: dotnet build Tidverk.sln --configuration Release --no-restore -m:1 -nodeReuse:false
      - run: dotnet test Tidverk.sln --configuration Release --no-build --no-restore -m:1 -nodeReuse:false
      - if: runner.os == 'Linux'
        run: dotnet format Tidverk.sln --no-restore --verify-no-changes

  package:
    name: Package ${{ matrix.rid }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            channel: linux
          - os: windows-latest
            rid: win-x64
            channel: win
    env:
      VPK_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - shell: bash
        run: scripts/package-${{ matrix.rid }}.sh
      - uses: actions/upload-artifact@v4
        with:
          name: velopack-${{ matrix.channel }}
          path: artifacts/releases/${{ matrix.channel }}/*
          if-no-files-found: error
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer-bundle
          path: artifacts/extras/linux/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VPK_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v4
        with:
          name: velopack-linux
          path: release-assets/linux
      - uses: actions/download-artifact@v4
        with:
          name: velopack-win
          path: release-assets/win
      - uses: actions/download-artifact@v4
        with:
          name: linux-installer-bundle
          path: release-assets/linux-bundle
      - shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          release_name="Tidverk ${version}"
          dotnet dnx vpk --version 1.2.0 --yes -- --legacyConsole upload github --repoUrl "https://github.com/${GITHUB_REPOSITORY}" --channel linux --outputDir release-assets/linux --tag "$GITHUB_REF_NAME" --releaseName "$release_name"
          dotnet dnx vpk --version 1.2.0 --yes -- --legacyConsole upload github --repoUrl "https://github.com/${GITHUB_REPOSITORY}" --channel win --outputDir release-assets/win --tag "$GITHUB_REF_NAME" --releaseName "$release_name" --merge

          checksum_file="$RUNNER_TEMP/SHA256SUMS"
          while IFS= read -r asset; do
            sha256sum "$asset" | sed "s#  $asset#  $(basename "$asset")#"
          done < <(find release-assets -type f \( -name '*.AppImage' -o -name '*Setup.exe' -o -name '*Portable.zip' -o -name '*.tar.gz' \) -print | sort) > "$checksum_file"

          gh release upload "$GITHUB_REF_NAME" release-assets/linux-bundle/*.tar.gz "$checksum_file" --clobber
          gh release edit "$GITHUB_REF_NAME" --notes-file "docs/release-notes/${version}.md" --draft=false --latest
