name: Build and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Tidverk.sln --disable-parallel
      - run: dotnet build Tidverk.sln --configuration Release --no-restore -m:1 -nodeReuse:false
      - run: dotnet test Tidverk.sln --configuration Release --no-build --no-restore -m:1 -nodeReuse:false
      - if: runner.os == 'Linux'
        run: dotnet format Tidverk.sln --no-restore --verify-no-changes
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($script in @("install-user.ps1", "uninstall-user.ps1")) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile("$PWD/packaging/windows/$script", [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish src/Tidverk.App/Tidverk.App.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/publish/win-x64 -p:PublishSingleFile=false
          $packageRoot = Join-Path $env:RUNNER_TEMP "Tidverk-package"
          New-Item -ItemType Directory -Force -Path (Join-Path $packageRoot "app") | Out-Null
          Copy-Item "artifacts/publish/win-x64/*" (Join-Path $packageRoot "app") -Recurse
          Copy-Item "packaging/windows/install-user.ps1" (Join-Path $packageRoot "install.ps1")
          Copy-Item "packaging/windows/uninstall-user.ps1" (Join-Path $packageRoot "uninstall-user.ps1")
          $version = dotnet msbuild src/Tidverk.App/Tidverk.App.csproj -getProperty:Version -nologo
          Set-Content (Join-Path $packageRoot "version.txt") $version
          & (Join-Path $packageRoot "install.ps1")
          $installDirectory = Join-Path $env:LOCALAPPDATA "Programs\Tidverk"
          $shortcut = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Tidverk.lnk"
          if (-not (Test-Path (Join-Path $installDirectory "Tidverk.exe"))) { throw "Tidverk.exe was not installed" }
          if (-not (Test-Path $shortcut)) { throw "Start menu shortcut was not installed" }
          if (-not (Test-Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Tidverk")) { throw "Uninstall registration was not created" }
          & (Join-Path $installDirectory "uninstall.ps1")
          if (Test-Path $installDirectory) { throw "Tidverk application files were not removed" }

  package:
    name: Build release packages
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: scripts/package-linux-x64.sh
      - run: scripts/package-win-x64.sh
      - name: Verify package integrity and Linux installation
        run: |
          sha256sum -c artifacts/packages/*.sha256
          7z t artifacts/packages/Tidverk-*-win-x64.zip
          package_dir=$(find artifacts/packages/.staging -maxdepth 1 -type d -name 'Tidverk-*-linux-x64' -print -quit)
          test_home="$RUNNER_TEMP/tidverk-home"
          HOME="$test_home" "$package_dir/install.sh"
          test -x "$test_home/.local/opt/tidverk/Tidverk"
          HOME="$test_home" "$package_dir/uninstall.sh"
          test ! -e "$test_home/.local/opt/tidverk"
      - uses: actions/upload-artifact@v4
        with:
          name: Tidverk-packages
          path: |
            artifacts/packages/*.tar.gz
            artifacts/packages/*.zip
            artifacts/packages/*.sha256
          if-no-files-found: error
