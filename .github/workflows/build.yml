name: Build and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore Tidverk.sln --disable-parallel
      - run: dotnet build Tidverk.sln --configuration Release --no-restore -m:1 -nodeReuse:false
      - run: dotnet test Tidverk.sln --configuration Release --no-build --no-restore -m:1 -nodeReuse:false
      - if: runner.os == 'Linux'
        run: dotnet format Tidverk.sln --no-restore --verify-no-changes

  package:
    name: Package ${{ matrix.rid }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            channel: linux
          - os: windows-latest
            rid: win-x64
            channel: win
    env:
      TIDVERK_SKIP_RELEASE_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - shell: bash
        run: scripts/package-${{ matrix.rid }}.sh
      - if: runner.os == 'Linux'
        shell: bash
        run: |
          test -f artifacts/releases/linux/releases.linux.json
          appimage=$(find artifacts/releases/linux -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          test -n "$appimage"
          test -f artifacts/extras/linux/Tidverk-*-linux-x64.tar.gz
          chmod +x "$appimage"
          version=$(dotnet msbuild src/Tidverk.App/Tidverk.App.csproj -getProperty:Version -nologo)
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 60 "$appimage" --veloapp-updated "$version"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem artifacts/releases/win -Filter "*Setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "Velopack Setup.exe was not created" }
          if (-not (Test-Path artifacts/releases/win/releases.win.json)) { throw "Windows update feed was not created" }
          $installDirectory = Join-Path $env:RUNNER_TEMP "Tidverk-install"
          & $setup.FullName --silent --installto $installDirectory
          if ($LASTEXITCODE -ne 0) { throw "Setup.exe failed with exit code $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $installDirectory "Tidverk.exe"))) { throw "Tidverk launcher was not installed" }
          if (-not (Test-Path (Join-Path $installDirectory "Update.exe"))) { throw "Velopack updater was not installed" }
          & (Join-Path $installDirectory "Update.exe") --silent uninstall
          if ($LASTEXITCODE -ne 0) { throw "Velopack uninstall failed with exit code $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: velopack-${{ matrix.channel }}
          path: artifacts/releases/${{ matrix.channel }}/*
          if-no-files-found: error
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-installer-bundle
          path: artifacts/extras/linux/*.tar.gz
          if-no-files-found: error
